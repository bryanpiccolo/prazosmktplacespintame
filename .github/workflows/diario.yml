name: Coleta diária de prazos

on:
  schedule:
    - cron: "5 9 * * *"        # todo dia às 06:05 (horário de Brasília = UTC-3)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

permissions:
  contents: write              # salvar o histórico no repositório
  pages: write                 # publicar o painel
  id-token: write

concurrency:
  group: prazos-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
      PRAZOS_DADOS: dados
      PRAZOS_PAINEL: site/index.html
      # sem segredos: o ML é consultado pelo cálculo público de frete
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests cryptography

      - name: Coletar prazos e entregas
        id: coleta
        continue-on-error: true
        run: python prazos.py coletar

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "monitor-prazos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dados/historico.sqlite || true
          git add -f dados/tokens_ml.enc 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Coleta de $(date +%d/%m/%Y)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar painel
        id: publicar
        uses: actions/deploy-pages@v4

      - name: Marcar execução como falha se a coleta falhou
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "A coleta teve erro — veja o passo 'Coletar prazos e entregas' acima."
          exit 1
